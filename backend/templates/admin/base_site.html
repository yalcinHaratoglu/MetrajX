{% extends "admin/base_site.html" %}
{% load i18n %}

{% block extrastyle %}
{{ block.super }}
<style>
  .conmanage-admin-branding {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .conmanage-company-filter {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    margin: 0;
  }
  .conmanage-company-filter label {
    color: var(--header-link-color, #fff);
    font-size: 0.8125rem;
    font-weight: 400;
  }
  .conmanage-company-filter select {
    color: #1a1a1a !important;
    background-color: #ffffff !important;
    border: 1px solid #c4c4c4;
    border-radius: 4px;
    padding: 0.35rem 0.5rem;
    max-width: 16rem;
    min-width: 10rem;
    font-size: 0.8125rem;
    line-height: 1.3;
    color-scheme: light;
    -webkit-appearance: menulist;
    appearance: menulist;
  }
  .conmanage-company-filter select option {
    color: #1a1a1a !important;
    background-color: #ffffff !important;
  }
  .conmanage-company-filter select:focus {
    outline: 2px solid #417690;
    outline-offset: 1px;
  }
</style>
{% endblock %}

{% block branding %}
<div class="conmanage-admin-branding">
  <a href="{% url 'admin:index' %}">{{ site_header|default:_('Django administration') }}</a>
  {% if admin_companies %}
  <form method="get" class="conmanage-company-filter">
    <label for="admin_company">{% trans "Firma" %}:</label>
    <select name="admin_company" id="admin_company" onchange="this.form.submit()">
      <option value="all" {% if admin_selected_company == "all" %}selected{% endif %}>{% trans "Tüm firmalar" %}</option>
      {% for company in admin_companies %}
      <option value="{{ company.pk }}" {% if admin_selected_company|stringformat:"s" == company.pk|stringformat:"s" %}selected{% endif %}>
        {{ company.name }}
      </option>
      {% endfor %}
    </select>
  </form>
  {% endif %}
</div>
{% endblock %}
